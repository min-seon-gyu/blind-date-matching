version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: blinddate-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: blinddate
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: blinddate-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blinddate-backend
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/blinddate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: local-dev-jwt-secret-key-change-in-production
      KAKAO_CLIENT_ID: your-kakao-client-id
      KAKAO_CLIENT_SECRET: your-kakao-client-secret
      TOSS_CLIENT_KEY: your-toss-client-key
      TOSS_SECRET_KEY: your-toss-secret-key

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blinddate-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data:
